name: Build fork Voice runtime
description: Build the upstream pinned helper and native runtime for this exact commit.
inputs:
  target:
    required: true
    description: Native target triple matching the runner
outputs:
  helper:
    description: Same-commit Voice helper
    value: ${{ steps.build.outputs.helper }}
  runtime:
    description: Verified public-release runtime
    value: ${{ steps.build.outputs.runtime }}
runs:
  using: composite
  steps:
    - id: prepare_bazel
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: ${{ inputs.target }}
        cache-scope: fork-voice
    - uses: ./.github/actions/setup-bazel-windows
      if: runner.os == 'Windows'
      with:
        target: ${{ inputs.target }}
    - name: Configure Bazel disk cache for Voice
      id: voice_disk_cache
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VOICE_HASH: ${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'third_party/voice/**', 'codex-rs/voice-host/**', 'codex-rs/Cargo.lock') }}
      run: |
        set -euo pipefail
        disk_cache_path="$CI_BUILD_ROOT/bazel-disk-cache"
        mkdir -p "$disk_cache_path"
        echo "disk-cache-path=$disk_cache_path" >> "$GITHUB_OUTPUT"
        echo "disk-cache-key=bazel-disk-fork-voice-v1-${TARGET}-${VOICE_HASH}" >> "$GITHUB_OUTPUT"
        echo "disk-cache-restore-key=bazel-disk-fork-voice-v1-${TARGET}-" >> "$GITHUB_OUTPUT"
    - name: Restore Bazel disk cache for Voice
      id: restore_voice_disk_cache
      continue-on-error: true
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.voice_disk_cache.outputs.disk-cache-path }}
        key: ${{ steps.voice_disk_cache.outputs.disk-cache-key }}
        restore-keys: |
          ${{ steps.voice_disk_cache.outputs.disk-cache-restore-key }}
    - name: Build and stage matching Voice inputs
      id: build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        BAZEL_DISK_CACHE: ${{ steps.voice_disk_cache.outputs.disk-cache-path }}
      run: |
        set -euo pipefail
        arch="${TARGET%%-*}"
        suffix=""
        wrapper=(--remote-download-toplevel --print-failed-action-summary)
        flags=(--config=release --disk_cache="$BAZEL_DISK_CACHE" --build_metadata="COMMIT_SHA=$GITHUB_SHA")
        case "$RUNNER_OS" in
          Windows)
            prefix="windows_$arch"
            suffix=".exe"
            output="$(cygpath -u "$RUNNER_TEMP")/fork-voice"
            wrapper+=(--windows-msvc-host-platform)
            flags+=(--platforms=//:local_windows_msvc
              --extra_toolchains=//third_party/voice:windows_pkg_config_toolchain,//third_party/voice:windows_cmake_toolchain
              --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1
              --inject_repository="voice_windows_tools=$VOICE_WINDOWS_BAZEL_REPOSITORY"
              --//third_party/voice:windows_installed_tools=@voice_windows_tools//:tools
              --action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT" --host_action_env="SystemRoot=$VOICE_WINDOWS_SYSTEM_ROOT"
              --action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH" --host_action_env="PROCESSOR_ARCHITECTURE=$VOICE_WINDOWS_HOST_ARCH"
              --workspace_status_command=./scripts/workspace-status.cmd)
            ;;
          macOS)
            prefix="macos_$arch"
            output="$RUNNER_TEMP/fork-voice"
            flags+=(--macos_minimum_os=14.0)
            ;;
          Linux)
            prefix="linux_$arch"
            output="$RUNNER_TEMP/fork-voice"
            ;;
          *) exit 1 ;;
        esac
        ./.github/scripts/run-bazel-ci.sh "${wrapper[@]}" -- build "${flags[@]}" -- \
          //codex-rs/voice-host:codex-voice-host //third_party/voice:native_runtime
        mkdir -p "$output"
        python3 third_party/voice/release_runtime.py stage \
          --target "$TARGET" --source "bazel-bin/third_party/voice/native_runtime_$prefix" --output "$output/runtime"
        cp "bazel-bin/codex-rs/voice-host/codex-voice-host$suffix" "$output/codex-voice-host$suffix"
        # Shut down the Bazel JVM server so Windows releases cache file handles
        # and Cargo ThinLTO reclaims ~2 GiB of runner memory.
        if [[ "$RUNNER_OS" == Windows ]]; then
          MSYS2_ARG_CONV_EXCL='*' bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" shutdown >/dev/null 2>&1 || true
        else
          bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" shutdown >/dev/null 2>&1 || true
        fi
        # Bazel outputs can be read-only; stripping and signing mutate this staged copy.
        chmod u+w "$output/codex-voice-host$suffix"
        if [[ "$RUNNER_OS" == macOS ]]; then
          strip -S -x "$output/codex-voice-host"
          codesign --force --sign - "$output/codex-voice-host"
        elif [[ "$RUNNER_OS" == Linux ]]; then
          strip --strip-debug --strip-unneeded "$output/codex-voice-host"
        elif [[ "$RUNNER_OS" == Windows ]]; then
          python3 third_party/voice/windows_crt.py --root "$output/runtime" --target "$TARGET" --helper "$output/codex-voice-host.exe"
        fi
        python3 third_party/voice/release_runtime.py seal --target "$TARGET" --output "$output/runtime"
        if [[ "$RUNNER_OS" == Windows ]]; then
          output="$(cygpath -w "$output")"
        fi
        echo "helper=$output/codex-voice-host$suffix" >> "$GITHUB_OUTPUT"
        echo "runtime=$output/runtime" >> "$GITHUB_OUTPUT"
    - name: Save Bazel repository cache
      if: steps.prepare_bazel.outputs.repository-cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
        key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
    - name: Save Bazel disk cache for Voice
      if: steps.restore_voice_disk_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.voice_disk_cache.outputs.disk-cache-path }}
        key: ${{ steps.voice_disk_cache.outputs.disk-cache-key }}
