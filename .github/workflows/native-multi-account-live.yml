name: Native multi-account live wiring

on:
  push:
    branches:
      - feature/native-multi-account

permissions:
  contents: write

concurrency:
  group: native-multi-account-live
  cancel-in-progress: false

jobs:
  wire-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'feat(core): wire native multi-account failover') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply guarded source patch
        run: |
          python3 scripts/apply_native_multi_account_live.py
          python3 scripts/fix_native_multi_account_live.py

      - name: Format Rust sources
        working-directory: codex-rs
        run: cargo fmt --all

      - name: Reject whitespace errors
        run: git diff --check

      - name: Check affected crates
        working-directory: codex-rs
        run: cargo check -p codex-login -p codex-history -p codex-core

      - name: Test account pool and persistence
        working-directory: codex-rs
        run: |
          cargo test -p codex-login account_pool --lib
          cargo test -p codex-login account_runtime_state --lib
          cargo test -p codex-history --test execution_provenance

      - name: Test failover and history transition
        working-directory: codex-rs
        run: |
          cargo test -p codex-core failover --lib
          cargo test -p codex-core account_transition --lib

      - name: Commit validated wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/core
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(core): wire native multi-account failover"
          git push origin HEAD:feature/native-multi-account
