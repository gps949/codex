# Fork maintenance: the checks that actually gate this fork's changes.
#
# The inherited upstream workflows (bazel, rust-ci, sdk, blocking-ci) depend on
# self-hosted runner groups, paid larger macOS runners, and BuildBuddy secrets
# that only exist in openai/codex, so they can never pass on a personal fork.
# Disable them in the Actions UI and treat this workflow as the fork's gate.
name: fork-ci

on:
  pull_request: {}
  push:
    branches:
      - feature/native-multi-account

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    # Cold-cache builds of the clippy + test tree can exceed an hour on the
    # 4-core free runner; warm runs settle far below this.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      # Text checks run before the Rust cache restores codex-rs/target, so
      # codespell never scans restored build artifacts.
      - name: Spelling (codespell)
        run: pipx run codespell --config .codespellrc --ignore-words .codespellignore

      - name: Formatting (rustfmt)
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Prettier on fork-owned files
        run: npx --yes prettier@3.5.3 --check FORK_MAINTENANCE.md fork/README.md fork/README.zh-CN.md fork/ACCOUNT_MANAGER.md fork/ACCOUNT_MANAGER.zh-CN.md fork/DECISION_MODELS.md fork/DECISION_MODELS.zh-CN.md fork/MODEL_ROUTING_DESIGN.md fork/MODEL_ROUTING_DESIGN.zh-CN.md .github/workflows/fork-ci.yml .github/workflows/fork-release.yml .github/workflows/upstream-sync-check.yml codex-rs/app-server/src/account_management/webui

      - name: Account manager browser lifecycle
        run: |
          node codex-rs/app-server/src/account_management/web_lifecycle_browser_tests.cjs
          node codex-rs/app-server/src/account_management/web_reset_operations_tests.cjs

      - name: Fork installer and release gate regressions
        run: |
          python3 -m unittest discover -s scripts -p test_fork_install.py
          python3 -m unittest discover -s .github/scripts -p test_fork_release_gate.py
          python3 -m unittest discover -s .github/scripts -p test_restore_rusty_v8_native.py
          python3 -m unittest discover -s .github/scripts -p test_latest_upstream_stable_tag.py

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          cache-on-failure: true

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config libcap-dev

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-shear@1.11.2

      - name: Unused dependencies (cargo shear)
        working-directory: codex-rs
        run: cargo shear

      - name: Clippy on fork-touched crates
        working-directory: codex-rs
        run: cargo clippy --tests -p codex-backend-client -p codex-login -p codex-config -p codex-history -p codex-model-provider -p codex-models-manager -p codex-core -p codex-cli -p codex-tui -p codex-app-server -p codex-app-server-transport -p codex-app-server-protocol -- -D warnings

      - name: Build test helper binaries
        working-directory: codex-rs
        # The codex-core integration fixture requires the Linux sandbox binary,
        # which a package-scoped nextest build does not produce on its own.
        run: cargo build -p codex-linux-sandbox -p codex-rmcp-client --bin codex-linux-sandbox --bin test_stdio_server

      - name: Multi-account tests
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
          NEXTEST_PROFILE: default
        # Build the selected packages together to unify shared dependency features.
        # Package and binary filters preserve the existing test coverage.
        run: |
          cargo nextest run --no-fail-fast \
            -p codex-backend-client -p codex-login -p codex-config -p codex-history -p codex-protocol -p codex-app-server-protocol \
            -p codex-model-provider -p codex-models-manager -p codex-core -p codex-tui -p codex-cli -p codex-app-server -p codex-app-server-transport \
            -E '
              (package(=codex-backend-client) and test(credit_expiry)) or
              package(=codex-login) or
              package(=codex-config) or
              package(=codex-history) or
              (package(=codex-model-provider) and (test(decision_advisor) or test(model_routing))) or
              (package(=codex-protocol) and test(usage_limit)) or
              package(=codex-app-server-protocol) or
              (package(=codex-models-manager) and (test(warmup) or test(routing_catalog))) or
              (package(=codex-core) and (test(task_model_routing) or test(account_failover) or test(failover) or test(account_transition) or test(preemptive) or test(account_request_auth) or test(opaque_history_migration) or test(account_window_warmup) or test(execution_auth) or test(account_pool_strategy) or test(account_pool_recovery) or test(account_pool_metadata_recovery) or test(account_recovered_reentry) or test(reset_credit) or test(captured_maintenance) or test(model_specific_limit) or test(durable_) or test(api_account_execution) or test(credit_expiry) or test(decision_advisor) or test(skill_advisor) or test(skill_suggestion) or test(tool_search) or test(search_tool))) or
              (package(=codex-tui) and (test(account) or test(warmup) or test(selection_row_layout) or test(model_routing) or test(model_selection) or test(model_auto) or test(reset_credit) or test(chatwidget::tests::usage))) or
              (package(=codex-cli) and ((kind(test) and (binary(=account_selection) or binary(=account_manager_names) or binary(=account_primary) or binary(=account_manager_preferences) or binary(=decision_advisor))) or (kind(bin) and binary(=codex) and (test(doctor::updates) or test(quota_observations) or test(account_cmd::quota_display) or test(account_cmd::display) or test(account_selector) or test(account_primary) or test(account_manager))))) or
              (package(=codex-app-server-transport) and (test(host_policy_retry) or test(primary_login_handover))) or
              (package(=codex-app-server) and (test(model_selection) or test(reset_credit_journal) or test(account_pool) or test(mobile_account) or test(mobile_quota) or test(pool_warnings) or test(pool_warning) or test(guarded_pool_notification) or test(status_overlay) or test(workspace_routing) or test(rate_limit_reset) or test(rate_limits_identity) or test(native_status) or test(mobile_warmup) or test(get_account_rate_limits) or test(login_survives_same_owner_token_refresh) or test(account_management) or test(native_account) or test(primary_login) or test(host_login) or test(remote_control) or test(outgoing_owned_request) or test(user_verification_ownership)))
            '
