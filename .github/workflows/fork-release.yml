# Fork release pipeline.
#
# Tag format: rust-vX.Y.Z-ma.N, where X.Y.Z is the upstream stable baseline and
# N is the fork iteration on that baseline. The binary is stamped X.Y.Z+ma.N
# (valid semver build metadata), and the in-app update check compares on the
# upstream base, so pushing a tag for a newer baseline notifies existing users.
#
# This intentionally replaces the upstream rust-release* workflows, which need
# Apple signing identities, R2 buckets, and self-hosted runners that do not
# exist on this fork. The upstream workflow also triggers on rust-v* tags —
# disable it in the Actions UI when it first appears.
name: fork-release

on:
  push:
    tags:
      - "rust-v*-ma.*"
  # One-button release: computes the next version automatically (upstream
  # baseline from .github/upstream-baseline.txt plus the next free ma.N),
  # creates the tag, and builds it. Optionally pass an explicit tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (rust-vX.Y.Z-ma.N); leave empty to auto-compute"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            baseline="$(cat .github/upstream-baseline.txt)"
            next=1
            while git rev-parse -q --verify "refs/tags/${baseline}-ma.${next}" >/dev/null; do
              next=$((next + 1))
            done
            tag="${baseline}-ma.${next}"
          fi
          case "$tag" in
            rust-v*-ma.*) ;;
            *) echo "invalid tag: $tag (expected rust-vX.Y.Z-ma.N)" >&2; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
            echo "created tag $tag at $GITHUB_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # libcap-dev is required by the bwrap sandbox helper.
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config libcap-dev

      # The rusty_v8 version-resolution script needs tomllib (Python 3.11+);
      # the ubuntu-22.04 runner ships 3.10, so install a modern Python first.
      - name: Set up Python for rusty_v8 version resolution
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Codex pins a v8 build flavor whose prebuilt static libraries are
      # published on the upstream openai/codex releases (public download),
      # not on denoland/rusty_v8; without this the v8 build script 404s.
      - name: Set up Codex-built rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Stamp version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#rust-v}"
          cargo_version="${version/-ma./+ma.}"
          python3 - "$cargo_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          manifest = Path("codex-rs/Cargo.toml")
          text = manifest.read_text()
          # The workspace version is "0.0.0" on development branches but already
          # stamped (for example "0.149.1") on official release-tag baselines;
          # replace whatever single top-level version line is present.
          stamped, count = re.subn(
              r'^version = "[^"]+"$', f'version = "{version}"', text, count=0, flags=re.M
          )
          if count != 1:
              raise SystemExit(f"expected exactly one workspace version line, found {count}")
          manifest.write_text(stamped)
          print(f"stamped {version}")
          PY

      - name: Build codex
        working-directory: codex-rs
        shell: bash
        # Mirror the upstream CLI bundle: codex plus the sibling binaries the
        # TUI spawns at runtime (code-mode host, responses proxy; bwrap
        # sandbox helper on Linux).
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} --bin codex -p codex-cli
          cargo build --release --target ${{ matrix.target }} -p codex-code-mode-host
          cargo build --release --target ${{ matrix.target }} -p codex-responses-api-proxy
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cargo build --release --target ${{ matrix.target }} --bin bwrap
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          release_dir="codex-rs/target/${{ matrix.target }}/release"
          case "${{ matrix.target }}" in
            *windows*)
              cp "$release_dir/codex.exe" "$release_dir/codex-code-mode-host.exe" "$release_dir/codex-responses-api-proxy.exe" stage/
              (cd stage && 7z a "../dist/codex-${{ matrix.target }}.zip" .)
              ;;
            *linux*)
              cp "$release_dir/codex" "$release_dir/codex-code-mode-host" "$release_dir/codex-responses-api-proxy" "$release_dir/bwrap" stage/
              tar czf "dist/codex-${{ matrix.target }}.tar.gz" -C stage .
              ;;
            *)
              cp "$release_dir/codex" "$release_dir/codex-code-mode-host" "$release_dir/codex-responses-api-proxy" stage/
              tar czf "dist/codex-${{ matrix.target }}.tar.gz" -C stage .
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${RELEASE_TAG#rust-v} (multi-account fork)" \
            --notes "Multi-account fork build. Baseline: upstream ${RELEASE_TAG%%-ma.*}.

          Install (macOS arm64 / Linux x64):
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/feature/native-multi-account/install.sh | bash
          \`\`\`
          Or download the asset for your platform, extract, and keep ALL extracted binaries together in one directory on your PATH (codex spawns its sibling helper binaries by path). Linux builds link against system OpenSSL 3." \
            dist/*
