# Fork maintenance: weekly upstream release radar.
#
# This job is deliberately metadata-only (no Rust build) so a run costs about a
# minute. It looks for a new upstream stable release tag, checks whether the
# fork's contact-surface files changed in that release, and opens a tracking
# issue with the findings. The actual rebase + test work is done by an agent or
# a human following FORK_MAINTENANCE.md, not by CI.
name: upstream-sync-check

on:
  schedule:
    # Mondays 03:17 UTC. Note: scheduled workflows only run from the repo's
    # default branch, so this file must exist there.
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (blobless)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/openai/codex.git
          git fetch --quiet --filter=blob:none upstream 'refs/tags/rust-v*:refs/tags/rust-v*'

      - name: Compare with baseline and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline="$(cat .github/upstream-baseline.txt)"
          latest="$(git tag -l 'rust-v*' | python3 .github/scripts/latest_upstream_stable_tag.py)"
          echo "baseline=$baseline latest=$latest"
          if [ "$latest" = "$baseline" ]; then
            echo "No new upstream stable release."
            exit 0
          fi

          title="Upstream sync: $latest"
          if gh issue list --state open --search "in:title \"$title\"" --json title --jq '.[].title' | grep -qF "$title"; then
            echo "Issue already exists."
            exit 0
          fi

          # Derive the contact surface from the current fork instead of maintaining
          # a stale list as upstream modules move or new fork integration points appear.
          contact_paths=()
          while IFS= read -r changed_path; do
            contact_paths+=("$changed_path")
          done < <(git diff --name-only "$baseline" HEAD -- 'codex-rs/**/*.rs' 'codex-rs/**/Cargo.toml' codex-rs/Cargo.toml codex-rs/Cargo.lock)
          touched="$(git diff --name-only "$baseline".."$latest" -- "${contact_paths[@]}" || true)"
          commit_count="$(git rev-list --count "$baseline".."$latest")"

          # Auth/credential-format changes need a special compatibility check
          # because pool profiles keep their own auth.json copies.
          auth_touched="$(git diff --name-only "$baseline".."$latest" -- codex-rs/login/src || true)"

          {
            echo "Upstream published \`$latest\` (baseline: \`$baseline\`, $commit_count commits)."
            echo
            if [ -n "$touched" ]; then
              echo "### Contact-surface files changed upstream (manual adaptation likely)"
              echo '```'
              echo "$touched"
              echo '```'
            else
              echo "### No contact-surface files changed — no changed integration point was detected; still review the merge"
            fi
            echo
            if [ -n "$auth_touched" ]; then
              echo "> Upstream touched \`codex-rs/login/\`. Check per-profile credential (auth.json) compatibility before releasing."
              echo
            fi
            echo "Follow the sync procedure in \`FORK_MAINTENANCE.md\`. After the sync branch is merged, update \`.github/upstream-baseline.txt\` to \`$latest\`."
          } > /tmp/issue-body.md

          cat /tmp/issue-body.md >> "$GITHUB_STEP_SUMMARY"
          if ! gh issue create --title "$title" --body-file /tmp/issue-body.md; then
            echo "::warning::Could not create the upstream sync issue; findings are available in the job summary."
          fi
