name: zz-windows-compile-check

on:
  push:
    branches:
      - cursor/sync-rust-v0-159-2-833a

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Set up Python for rusty_v8 version resolution
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Codex-built rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Check release binaries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --release --target x86_64-pc-windows-msvc --bin codex -p codex-cli
          cargo check --release --target x86_64-pc-windows-msvc -p codex-code-mode-host -p codex-responses-api-proxy
          cargo check --release --target x86_64-pc-windows-msvc -p codex-windows-sandbox --bin codex-windows-sandbox-setup --bin codex-command-runner
          cargo check --release --target x86_64-pc-windows-msvc -p codex-windows-sandbox-service --bin codex-windows-sandbox-service

      - name: Check fork-touched crates with tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --tests --target x86_64-pc-windows-msvc -p codex-login -p codex-app-server-daemon -p codex-app-server-transport
